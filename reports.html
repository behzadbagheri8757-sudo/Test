<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>گزارش‌ها — حبوبات و خشکبار باقری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="./css/app.css">
<style>
.report-section{margin-bottom:22px;}
.report-section h3{font-size:1rem;margin:0 0 10px;font-weight:800;}
.report-note{font-size:.75rem;color:var(--ink-soft);margin:6px 0 0;line-height:1.5;}
.debt-row a{text-decoration:none;color:inherit;}
</style>
</head>
<body data-page="reports">
<header>
  <h1>حبوبات و خشکبار باقری</h1>
  <p>دفتر حساب — فروش، مشتریان، انبار، تامین‌کننده‌ها</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab" style="display:none;">+</button>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script src="./js/models.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/db.js"></script>
<script src="./js/calc.js"></script>
<script src="./js/stock.js"></script>
<script src="./js/payments.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/nav.js"></script>
<script src="./js/app.js"></script>
<script>
/* Phase 10 — reports page. Read-only use of calc.js helpers. No finance logic changes. */

let reportPeriod = 'all'; // today | week | month | all

function startOfWeek(ref){
  const d = new Date(ref);
  const day = d.getDay(); // 0=Sun
  // week starts Saturday in fa context: Saturday=6
  const diff = (day + 1) % 7; // days since Saturday
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - diff);
  return d;
}

function invoiceInPeriod(inv, period, now){
  if(period === 'all') return true;
  if(period === 'today') return isSameDay(inv.date, now);
  if(period === 'month') return isSameMonth(inv.date, now);
  if(period === 'week'){
    const d = new Date(inv.date);
    const start = startOfWeek(now);
    const end = new Date(start);
    end.setDate(end.getDate() + 7);
    return d >= start && d < end;
  }
  return true;
}

/** Same item/discount formula as customerProfit invoice part — for period display only */
function periodInvoiceGrossProfit(invoices){
  return invoices.reduce((sum, inv)=>{
    const itemsProfit = (inv.items||[]).reduce((a,it)=>
      a + ((it.price||0) - (it.buyPrice||0)) * (it.qty||0) - (it.discount||0), 0);
    return sum + itemsProfit - invoiceDiscountAmount(inv);
  }, 0);
}

function drawReportsPage(){
  const main = document.getElementById('main');
  if(!main) return;

  if(!document.getElementById('reports-body')){
    const chip = (id, label) =>
      `<button type="button" class="chip ${reportPeriod===id?'active':''}" data-rp="${id}">${label}</button>`;
    main.innerHTML = `
      <h2 class="section-title">گزارش‌ها</h2>
      <div class="field">
        <label>بازه زمانی (برای فروش و فاکتور)</label>
        <div class="chip-row" id="report-period-chips">
          ${chip('today','امروز')}
          ${chip('week','این هفته')}
          ${chip('month','این ماه')}
          ${chip('all','همه')}
        </div>
        <div class="report-note">مانده مشتری، تأمین‌کننده و ارزش انبار همیشه بر اساس وضعیت فعلی حساب است (وابسته به بازه نیست).</div>
      </div>
      <div id="reports-body"></div>
    `;
    document.querySelectorAll('#report-period-chips [data-rp]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        reportPeriod = btn.getAttribute('data-rp');
        document.querySelectorAll('#report-period-chips [data-rp]').forEach(b=>{
          b.classList.toggle('active', b.getAttribute('data-rp')===reportPeriod);
        });
        renderReportsBodyOnly();
      });
    });
  }
  renderReportsBodyOnly();
}

function renderReportsBodyOnly(){
  const body = document.getElementById('reports-body');
  if(!body) return;

  const now = new Date();
  const g = globalTotals();
  const invsAll = data.invoices || [];
  const invsPeriod = invsAll.filter(i => invoiceInPeriod(i, reportPeriod, now));
  const periodSales = invsPeriod.reduce((s,i)=>s+(i.total||0), 0);
  const periodCount = invsPeriod.length;
  const periodAvg = periodCount ? periodSales / periodCount : 0;
  const periodGrossProfit = periodInvoiceGrossProfit(invsPeriod);

  // invoice payment status (period)
  let paidCount = 0, openCount = 0;
  invsPeriod.forEach(inv=>{
    const paid = (inv.cashPaid||0)+(inv.cardPaid||0)+(inv.transferPaid||0)+(inv.checkPaid||0);
    const remain = (inv.total||0) - paid;
    if(remain <= 0.5) paidCount++; else openCount++;
  });

  // customers
  const customers = data.customers || [];
  let debtors=0, settled=0, creditors=0;
  customers.forEach(c=>{
    const bal = customerTotals(c.id).balance;
    if(bal > 0.5) debtors++;
    else if(bal < -0.5) creditors++;
    else settled++;
  });
  const topDebtors = debtorList(8);

  // suppliers
  const suppliers = data.suppliers || [];
  let supDebtTotal = 0, supWithDebt = 0;
  const topSuppliers = suppliers.map(s=>{
    const t = supplierTotals(s.id);
    if(t.balance > 0.5){ supDebtTotal += t.balance; supWithDebt++; }
    return { s, t };
  }).filter(x=>x.t.balance>0.5).sort((a,b)=>b.t.balance-a.t.balance).slice(0,8);

  // inventory
  const products = data.products || [];
  const invVal = inventoryValue();
  const low = lowStockProducts();
  const zero = products.filter(p => (p.stockQty||0) === 0);
  const negative = products.filter(p => (p.stockQty||0) < 0);

  const periodLabel = {today:'امروز', week:'این هفته', month:'این ماه', all:'همه زمان‌ها'}[reportPeriod];

  body.innerHTML = `
    <div class="report-section">
      <h3>خلاصه فروش — ${esc(periodLabel)}</h3>
      <div class="cards">
        <div class="card"><div class="label">فروش دوره</div><div class="value">${toman(periodSales)} ت</div></div>
        <div class="card"><div class="label">تعداد فاکتور</div><div class="value">${periodCount}</div></div>
        <div class="card"><div class="label">میانگین فاکتور</div><div class="value">${toman(periodAvg)} ت</div></div>
        <div class="card"><div class="label">فروش امروز</div><div class="value">${toman(g.todaySales)} ت</div></div>
        <div class="card"><div class="label">فروش این ماه</div><div class="value">${toman(g.monthSales)} ت</div></div>
        <div class="card"><div class="label">فروش کل</div><div class="value">${toman(g.totalSales)} ت</div></div>
      </div>
    </div>

    <div class="report-section">
      <h3>سود</h3>
      <div class="cards">
        <div class="card wide"><div class="label">سود کل (منطق customerProfit روی همه مشتریان)</div>
          <div class="value accent-olive">${toman(g.totalProfit)} ت</div></div>
        <div class="card wide"><div class="label">سود ناخالص فاکتورهای دوره «${esc(periodLabel)}»</div>
          <div class="value">${toman(periodGrossProfit)} ت</div>
          <div class="report-note">همان فرمول ردیف فاکتور (قیمت − buyPrice تاریخی − تخفیف). برگشت/تخفیف تراکنشی فقط در «سود کل» لحاظ شده است.</div>
        </div>
        <div class="card"><div class="label">دریافت نقد/کارت/انتقال (کل)</div><div class="value">${toman(g.totalReceived)} ت</div></div>
        <div class="card"><div class="label">چک در جریان</div><div class="value accent-amber">${toman(g.outstandingChecks)} ت</div></div>
      </div>
    </div>

    <div class="report-section">
      <h3>مشتریان</h3>
      <div class="cards">
        <div class="card"><div class="label">تعداد کل</div><div class="value">${customers.length}</div></div>
        <div class="card"><div class="label">بدهکار</div><div class="value accent-rust">${debtors}</div></div>
        <div class="card"><div class="label">تسویه</div><div class="value">${settled}</div></div>
        <div class="card"><div class="label">بستانکار</div><div class="value accent-olive">${creditors}</div></div>
        <div class="card wide"><div class="label">مجموع بدهی مشتریان</div>
          <div class="value accent-rust">${toman(g.customerDebt)} ت</div></div>
      </div>
      ${topDebtors.length ? `
        <div class="sub-title" style="margin-top:12px;">بیشترین بدهی</div>
        ${topDebtors.map(({c,t})=>`
          <a class="ledger-row debt-row" href="./customer.html?id=${encodeURIComponent(c.id)}">
            <span class="name">${esc(c.name)}
              <span class="sub">${balanceStatusWord(t.balance)}</span>
            </span>
            <span class="filler"></span>
            <span class="amount accent-rust">${toman(t.balance)} ت</span>
          </a>`).join('')}
      ` : '<div class="empty" style="padding:8px 0;">بدهکاری ثبت نشده</div>'}
    </div>

    <div class="report-section">
      <h3>تأمین‌کنندگان</h3>
      <div class="cards">
        <div class="card"><div class="label">تعداد</div><div class="value">${suppliers.length}</div></div>
        <div class="card"><div class="label">دارای بدهی</div><div class="value">${supWithDebt}</div></div>
        <div class="card wide"><div class="label">مجموع بدهی به تأمین‌کنندگان</div>
          <div class="value accent-rust">${toman(g.supplierDebt)} ت</div></div>
      </div>
      ${topSuppliers.length ? topSuppliers.map(({s,t})=>`
        <a class="ledger-row debt-row" href="./supplier.html?id=${encodeURIComponent(s.id)}">
          <span class="name">${esc(s.name)}</span>
          <span class="filler"></span>
          <span class="amount accent-rust">${toman(t.balance)} ت</span>
        </a>`).join('') : '<div class="empty" style="padding:8px 0;">بدهی تأمین‌کننده نیست</div>'}
    </div>

    <div class="report-section">
      <h3>انبار</h3>
      <div class="cards">
        <div class="card"><div class="label">تعداد کالا</div><div class="value">${products.length}</div></div>
        <div class="card wide"><div class="label">ارزش موجودی (qty × buy)</div>
          <div class="value">${toman(invVal)} ت</div></div>
        <div class="card"><div class="label">کم‌موجود</div><div class="value accent-amber">${low.length}</div></div>
        <div class="card"><div class="label">ناموجود</div><div class="value">${zero.length}</div></div>
        <div class="card"><div class="label">موجودی منفی</div><div class="value accent-rust">${negative.length}</div></div>
      </div>
      ${low.length ? `
        <div class="sub-title" style="margin-top:10px;">کالاهای کم‌موجود</div>
        ${low.slice(0,10).map(p=>`
          <div class="ledger-row" style="cursor:default;">
            <span class="name">${esc(p.name)}
              <span class="sub">حداقل: ${p.minStock||0}</span>
            </span>
            <span class="filler"></span>
            <span class="amount accent-amber">${p.stockQty||0}</span>
          </div>`).join('')}
      ` : ''}
      ${negative.length ? `
        <div class="sub-title" style="margin-top:10px;">موجودی منفی</div>
        ${negative.slice(0,10).map(p=>`
          <div class="ledger-row" style="cursor:default;">
            <span class="name">${esc(p.name)}</span>
            <span class="filler"></span>
            <span class="amount accent-rust">${p.stockQty}</span>
          </div>`).join('')}
      ` : ''}
      <div class="btn-row" style="margin-top:10px;">
        <a class="btn small secondary" href="./inventory.html">رفتن به انبار</a>
        <a class="btn small secondary" href="./products.html">لیست کالاها</a>
      </div>
    </div>

    <div class="report-section">
      <h3>فاکتورها — ${esc(periodLabel)}</h3>
      <div class="cards">
        <div class="card"><div class="label">تعداد در دوره</div><div class="value">${periodCount}</div></div>
        <div class="card"><div class="label">پرداخت‌شده / بدون مانده</div><div class="value accent-olive">${paidCount}</div></div>
        <div class="card"><div class="label">دارای مانده</div><div class="value accent-rust">${openCount}</div></div>
        <div class="card wide"><div class="label">جمع مبلغ فاکتورهای دوره</div>
          <div class="value">${toman(periodSales)} ت</div></div>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <a class="btn small secondary" href="./invoices.html">همه فاکتورها</a>
      </div>
    </div>
  `;
}

bootPage('reports', function(){
  drawReportsPage();
});
</script>
</body>
</html>
